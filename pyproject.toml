[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartelemzo"
version = "0.1.0"
description = "TradingView képernyőképből technikai elemzés, kitörési valószínűség és szellemgyertyás előrejelzés"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15",
    "markdown>=3.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pydantic>=2.6",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chartelemzo = "chartelemzo.cli:main"

[tool.setuptools.packages.find]
include = ["chartelemzo*"]

[tool.setuptools.package-data]
chartelemzo = ["*.toml"]
